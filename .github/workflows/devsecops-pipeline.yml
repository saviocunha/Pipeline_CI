# Nome exibido na interface do GitHub Actions
name: Esteira DevSecOps (Validação e Segurança)

# Gatilhos de execução - git push ou Pull Request na branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Variáveis de ambiente
env:
  VERSAO_PYTHON: "3.9"  # Versão do Python utilizada nos testes e build
  NOME_VERSAO: "1.0.0"  # Tag/versão atribuída à imagem Docker final
  ENV_NAME: "producao"  # Nome do ambiente de destino

jobs:
  # JOB 1: Análise de Qualidade de Código e Testes Funcionais
  lint-and-test:
    name: 1. Qualidade e Testes Funcionais
    runs-on: ubuntu-latest  # Ambiente de execução gerenciado pelo GitHub

    steps:
      # Baixa o código do repositório para o runner
      - name: Baixar codigo fonte
        uses: actions/checkout@v3

      # Prepara o ambiente Python com a versão declarada na variável global
      - name: Configurar Python ${{ env.VERSAO_PYTHON }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.VERSAO_PYTHON }}

      # Atualiza o pip e instala as dependências necessárias da aplicação
      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Validação de código com Flake8
      - name: Lint com Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
      # Execução da suíte de testes unitários automatizados com Pytest
      - name: Executar Testes Unitarios (Pytest)
        run: |
          pytest -v

# JOB 2: Escaneamento de Segurança (SAST, SCA e Secrets)
security-scans:
  name: 2. Escaneamento de Segurança (SAST, SCA & Secrets)
  runs-on: ubuntu-latest
  steps:
    # Baixa todo o histórico do código (fetch-depth: 0) para o TruffleHog analisar commits antigos
    - name: Baixar codigo fonte
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Configurar Python ${{ env.VERSAO_PYTHON }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.VERSAO_PYTHON }}
    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Procura por segredos/chaves vazadas no código e histórico de commits (filtra por segredos confirmados)
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --only-verified
    
    # SAST: Análise estática do código Python buscando brechas de segurança
    # -ll = só reporta problemas com severidade MEDIUM ou maior.
    # -ii = só reporta problemas com confiança MEDIUM ou maior.
    - name: SAST - Análise Estática com Bandit
      run: |
        bandit -r . -ll -ii 
    
    # SCA: Verifica se os pacotes listados no requirements.txt têm vulnerabilidades conhecidas (CVEs)
    - name: SCA - Análise de Dependências com Pip-Audit
      run: |
        pip-audit -r requirements.txt

# JOB 3: Construção e Varredura da Imagem Docker
docker-build-and-scan:
  name: 3. Build Docker e Scan Trivy
  needs: [lint-and-test, security-scans] # Só executa se os Jobs 1 e 2 passarem sem erros
  runs-on: ubuntu-latest
  steps:
    - name: Baixar codigo fonte
      uses: actions/checkout@v3
    
    # Constrói uma imagem temporária local para validação de segurança
    - name: Build da Imagem Docker Local
      run: |
        docker build -t app:test .
    
    # Escaneia a imagem recém-criada em busca de vulnerabilidades no SO ou dependências (falha se encontrar CRITICAL ou HIGH)
    - name: Escaneamento de Vulnerabilidades da Imagem (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'app:test'
        format: 'table'
        exit-code: '1'            # Retorna código de erro 1 (falha o pipeline) se encontrar vulnerabilidades
        ignore-unfixed: true      # Ignora vulnerabilidades que ainda não possuem correção oficial
        vuln-type: 'os,library'   # Escaneia o SO da imagem base e as bibliotecas da aplicação
        severity: 'CRITICAL,HIGH' # Considera apenas vulnerabilidades de nível Alto ou Crítico

# JOB 4: Publicação da Imagem Docker no Registro (Release)
docker-build-and-push:
  name: 4. Build e Push Docker (Release)
  needs: [docker-build-and-scan]  # Só executa se o escaneamento da imagem (Job 3) passar
  runs-on: ubuntu-latest
  
  # Permissões necessárias para autenticar e publicar no GitHub Container Registry (GHCR)
  permissions:
    contents: read
    packages: write
  steps:
    - name: Baixar codigo fonte
      uses: actions/checkout@v3

    # Autentica no registro de contêineres do GitHub usando o token automático do fluxo
    - name: Login no GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build e Push da Imagem
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/fastorder-api:${{ env.NOME_VERSAO }}